[tools]
python = "3.13"
nodejs = "24"
java = "21"
go = "latest"
task = "latest"

[tasks.winget]
description = "Instalar tudo do winget"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/winget.ps1"

[tasks.chezmoi]
description = "Inicializar chezmoi"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/chezmoi.ps1"

[tasks.bootstrap]
description = "Run complete bootstrap"
run = [{ task = "winget" }, { task = "chezmoi" }]
