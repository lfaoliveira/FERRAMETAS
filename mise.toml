# Mise Tasks for Windows Bootstrap
# Tasks that call bootstrap.ps1
# Run with: mise run <task-name>

[env]
MISE_PROJECT_ROOT = "{{dir}}"

[tools]
python = "3.13"
nodejs = "20"
java = "21"
go = "latest"
task = "latest"

[env.work]
PROFILE = "work"

[env.personal]
PROFILE = "personal"

# Main bootstrap task
[tasks.bootstrap]
description = "Run complete bootstrap (WinGet packages + Mise tools + Chezmoi)"
run = """
  $profile = if ($env:BOOTSTRAP_PROFILE) { $env:BOOTSTRAP_PROFILE } else { 'personal' }
  & .\bootstrap.ps1 -Profile $profile
"""
